version: '3.8'

services:
  aria2:
    image: p3terx/aria2-pro
    container_name: pikpak-aria2
    restart: unless-stopped
    environment:
      # SECURITY: RPC_SECRET must be set in .env, no default
      - RPC_SECRET=${ARIA2_SECRET}
      - RPC_PORT=6800
      - LISTEN_PORT=6888
    volumes:
      - ./downloads:/downloads
      - ./aria2-config:/config
    ports:
      # SECURITY FIX: Removed 6800 host exposure - bot accesses via internal network only
      # Previously: "6800:6800" exposed RPC to all interfaces (Critical)
      # Now: Only torrent ports exposed, RPC is internal via pikpak-net
      - "6888:6888"
      - "6888:6888/udp"
    networks:
      - pikpak-net

  bot:
    build: .
    container_name: pikpak-bot
    restart: unless-stopped
    depends_on:
      - aria2
    env_file:
      - .env
    volumes:
      - ./downloads:/downloads
      - ./logs:/app/logs
      - ./config.yaml:/app/config.yaml:ro  # SECURITY FIX: Mount config.yaml (was commented out)
      - /etc/localtime:/etc/localtime:ro
    environment:
      - ARIA2_HOST=http://aria2:6800
      - TZ=Asia/Seoul
    networks:
      - pikpak-net

networks:
  pikpak-net:
    driver: bridge
