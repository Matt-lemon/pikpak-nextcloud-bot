# Ubuntu 개인 NAS용 - mir2mix.asuscomm.com
# 사용법: docker compose -f docker-compose.ubuntu.yml up -d

version: '3.8'

services:
  aria2:
    image: p3terx/aria2-pro
    container_name: pikpak-aria2
    restart: unless-stopped
    environment:
      # SECURITY: RPC_SECRET must be set in .env, no hardcoded default
      - RPC_SECRET=${ARIA2_SECRET}
      - RPC_PORT=6800
      - LISTEN_PORT=6888
      - IPV6_MODE=false
      - UMASK_SET=022
    volumes:
      - ./downloads:/downloads
      - ./aria2-config:/config
    ports:
      - "127.0.0.1:6800:6800"  # 외부 노출 금지, bot만 접근 (127.0.0.1 바인딩)
      - "6888:6888"
      - "6888:6888/udp"
    networks:
      - pikpak-net
    logging:
      driver: json-file
      options:
        max-size: "10m"

  bot:
    build: .
    container_name: pikpak-bot
    restart: unless-stopped
    depends_on:
      - aria2
    env_file:
      - .env
    volumes:
      - ./downloads:/downloads
      - ./logs:/app/logs
      - ./config.yaml:/app/config.yaml:ro  # SECURITY FIX: Mount config.yaml (was commented out)
      - /etc/localtime:/etc/localtime:ro  # NAS 시간 동기화
    environment:
      - ARIA2_HOST=http://aria2:6800
      - TZ=Asia/Seoul
    networks:
      - pikpak-net
    logging:
      driver: json-file
      options:
        max-size: "20m"

  # 보너스: 웹 대시보드 (선택) - 인증 필요, 기본 127.0.0.1만
  dashboard:
    build: .
    container_name: pikpak-dashboard
    restart: unless-stopped
    command: python tools/web_dashboard.py
    env_file:
      - .env
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    ports:
      - "127.0.0.1:8000:8000"  # SECURITY: Only localhost, change to 0.0.0.0 if needed with auth
    networks:
      - pikpak-net
    profiles:
      - dashboard  # docker compose --profile dashboard up -d 로 실행

networks:
  pikpak-net:
    driver: bridge
