# Ubuntu 개인 NAS용 - mir2mix.asuscomm.com
# 사용법: docker compose -f docker-compose.ubuntu.yml up -d

version: '3.8'

services:
  aria2:
    image: p3terx/aria2-pro
    container_name: pikpak-aria2
    restart: unless-stopped
    environment:
      - RPC_SECRET=${ARIA2_SECRET:-mir2mix_pikpak_2024}
      - RPC_PORT=6800
      - LISTEN_PORT=6888
      - IPV6_MODE=false
      - UMASK_SET=022
    volumes:
      - ./downloads:/downloads
      - ./aria2-config:/config
    ports:
      - "127.0.0.1:6800:6800"  # 외부 노출 금지, bot만 접근
      - "6888:6888"
      - "6888:6888/udp"
    networks:
      - pikpak-net
    logging:
      driver: json-file
      options:
        max-size: "10m"

  bot:
    build: .
    container_name: pikpak-bot
    restart: unless-stopped
    depends_on:
      - aria2
    env_file:
      - .env
    volumes:
      - ./downloads:/downloads
      - ./logs:/app/logs
      - /etc/localtime:/etc/localtime:ro  # NAS 시간 동기화
      # config.yaml은 선택 - 있으면 마운트, 없으면 기본값 사용
      # - ./config.yaml:/app/config.yaml:ro
    environment:
      - ARIA2_HOST=http://aria2:6800
      - TZ=Asia/Seoul
    networks:
      - pikpak-net
    logging:
      driver: json-file
      options:
        max-size: "20m"

  # 보너스: 웹 대시보드 (선택)
  dashboard:
    build: .
    container_name: pikpak-dashboard
    restart: unless-stopped
    command: python web_dashboard.py
    env_file:
      - .env
    ports:
      - "127.0.0.1:8000:8000"  # 필요하면 0.0.0.0:8000으로 변경
    networks:
      - pikpak-net
    profiles:
      - dashboard  # docker compose --profile dashboard up -d 로 실행

networks:
  pikpak-net:
    driver: bridge
